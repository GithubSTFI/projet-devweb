<div class="auth-wrapper">
    <div class="auth-card animate-scale-in">
        <div class="auth-header">
            <h2>Créer un compte</h2>
            <p class="subtitle">Rejoignez le gestionnaire Pro</p>
        </div>

        <div class="form-group">
            <label>Votre adresse e-mail</label>
            <input type="email" [(ngModel)]="email" class="input-modern" placeholder="Ex: alice@example.com"
                [class.error-border]="error">
        </div>

        <div class="form-group">
            <label>Choisissez un identifiant</label>
            <input type="text" [(ngModel)]="username" class="input-modern" placeholder="Ex: alice"
                [class.error-border]="error">
        </div>

        <div class="form-group">
            <label>Choisissez un mot de passe</label>
            <input type="password" [(ngModel)]="password" class="input-modern" placeholder="••••••••"
                [class.error-border]="error">
            
            <div class="password-criteria">
                <p [class.valid]="hasMinLength">● 8 caractères minimum</p>
                <p [class.valid]="hasUppercase">● Au moins une majuscule</p>
                <p [class.valid]="hasNumber">● Au moins un chiffre</p>
            </div>
        </div>

        <div *ngIf="error" class="error-banner">
            ⚠️ {{ error }}
        </div>

        <button (click)="register()" [disabled]="!isPasswordValid" class="btn-gradient full-width">
            S'inscrire
        </button>

        <div class="auth-footer">
            <p>Déjà un compte ? <a (click)="switchMode.emit()">Se connecter</a></p>
        </div>
    </div>
</div>
